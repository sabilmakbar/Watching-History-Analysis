[project]
name = "watching-history-analysis"
version = "0.1.0"
description = "Reproducible analysis of anonymized viewing history"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "plotly>=6.0",
    "scikit-learn>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watch_history"]
